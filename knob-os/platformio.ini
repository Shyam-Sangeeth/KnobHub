; Knob OS: firmware for the Knob Hub controller (Elecrow CrowPanel 1.28" ESP32-S3 rotary display).
; One shared core (src/core) and one hardware layer per target (src/hal/<target>):
;   pio run -e sim -t exec     the simulator: Knob OS in a window on the PC
;   pio run -e preview         knob_preview.dll: Knob OS inside Knob Hub, for its live preview of the knob
;   pio run -e crowpanel       the real knob (hardware layer still to be written)

[platformio]
default_envs = sim
; Build output stays out of OneDrive.
workspace_dir = ${sysenv.USERPROFILE}/.cache/knob-os

[env]
lib_deps =
  lvgl/lvgl@9.2.2
  bblanchon/ArduinoJson@7.2.1
build_flags =
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -I $PROJECT_DIR/include

[env:sim]
platform = native
; SDL2 (MinGW build in %USERPROFILE%\.tools\SDL2) is added by scripts/sdl.py.
build_flags =
  ${env.build_flags}
  -D KNOB_SIM
  -lws2_32
build_src_filter = +<core/> +<hal/sim/>
extra_scripts = pre:scripts/sdl.py

[env:preview]
platform = native
build_flags =
  ${env.build_flags}
  -D KNOB_PREVIEW
build_src_filter = +<core/> +<hal/preview/>
; Links a DLL (knob_preview.dll) instead of a program.
extra_scripts = pre:scripts/dll.py

[env:crowpanel]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags =
  ${env.build_flags}
  -D KNOB_ESP32
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; LVGL is set up by include/lv_conf.h, not ESP-IDF's Kconfig (whose headers LVGL's assembly files can't find).
  -D LV_KCONFIG_IGNORE
build_src_filter = +<core/> +<hal/esp32/>
