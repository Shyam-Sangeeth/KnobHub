; Knob OS: firmware for the Knob Hub controller (round ESP32-S3 knob displays such as Elecrow's CrowPanels).
; One shared core (src/core) and one hardware layer per target (src/hal/<target>):
;   pio run -e sim -t exec     the simulator: Knob OS in a window on the PC (program.exe --board <id> for another
;                              board's screen, see src/core/boards.cpp)
;   pio run -e preview         knob_preview.dll: Knob OS inside Knob Hub, for its live preview of the knob
;   pio run -e crowpanel-128   a real knob: one build per board, its pins in src/hal/esp32/boards/. Besides
;   pio run -e crowpanel-146   firmware.bin it makes knob-os.bin, the whole image a release ships (scripts/merged.py)

[platformio]
default_envs = sim
; Build output stays out of OneDrive.
workspace_dir = ${sysenv.USERPROFILE}/.cache/knob-os

[env]
lib_deps =
  lvgl/lvgl@9.2.2
  bblanchon/ArduinoJson@7.2.1
build_flags =
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_LVGL_H_INCLUDE_SIMPLE
  ; Strings up to 4 GB instead of 65,535 characters: album art on a big screen (160 x 160 on the 480 px preview) is
  ; about 68,000 characters of base64, and a longer string fails the whole message.
  -D ARDUINOJSON_STRING_LENGTH_SIZE=4
  -I $PROJECT_DIR/include

[env:sim]
platform = native
; SDL2 (MinGW build in %USERPROFILE%\.tools\SDL2) is added by scripts/sdl.py.
build_flags =
  ${env.build_flags}
  -D KNOB_SIM
  -lws2_32
build_src_filter = +<core/> +<hal/sim/>
extra_scripts = pre:scripts/sdl.py

[env:preview]
platform = native
build_flags =
  ${env.build_flags}
  -D KNOB_PREVIEW
build_src_filter = +<core/> +<hal/preview/>
; Links a DLL (knob_preview.dll) instead of a program.
extra_scripts = pre:scripts/dll.py

; What every real knob shares. A board's env adds KNOB_BOARD (its file in src/hal/esp32/boards/) and KNOB_FONT_SET
; (its screen size, so only its fonts are linked).
[esp32]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; The ESP32-S3 variant with Knob OS's own USB product id (variants/knob/pins_arduino.h).
board_build.variants_dir = variants
board_build.variant = knob
; -t upload: Knob OS's USB serial port restarts the knob into its loader when it's opened at 1200 baud, and the loader
; is a new port (the chip's USB Serial/JTAG unit). A knob already in its loader stays on its port.
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
lib_deps =
  ${env.lib_deps}
  lovyan03/LovyanGFX@1.2.34
build_flags =
  ${env.build_flags}
  -D KNOB_ESP32
  -D BOARD_HAS_PSRAM
  ; USB: a serial port of Knob OS's own (TinyUSB, on the ESP32-S3's USB OTG controller, 303A:0002), not the chip's
  ; USB Serial/JTAG unit (303A:1001). That unit's JTAG interface gets Windows' WinUSB driver, which puts the knob in
  ; Safely Remove Hardware; a plain serial port is safe to unplug. The ROM loader still uses the USB Serial/JTAG unit:
  ; Knob Hub gets there by opening the port at 1200 baud (the core restarts into it, see KnobFlasher). A knob whose
  ; Knob OS doesn't start has no USB until it's put in its loader with the boot button.
  -D ARDUINO_USB_MODE=0
  -D ARDUINO_USB_CDC_ON_BOOT=1
  '-D USB_MANUFACTURER="Knob Hub"'
  '-D USB_PRODUCT="Knob Hub knob"'
  ; LVGL is set up by include/lv_conf.h, not ESP-IDF's Kconfig (whose headers LVGL's assembly files can't find).
  -D LV_KCONFIG_IGNORE
  ; Optimised for speed, not size: LVGL draws a whole-screen frame in 33 ms instead of 133 ms.
  -O2
build_unflags =
  -Os
  ; the board's (esp32-s3-devkitc-1): USB Serial/JTAG
  -DARDUINO_USB_MODE=1
build_src_filter = +<core/> +<hal/esp32/>
extra_scripts = post:scripts/merged.py

[env:crowpanel-128]
extends = esp32
build_flags =
  ${esp32.build_flags}
  -D KNOB_BOARD=\"boards/crowpanel_1_28.h\"
  -D KNOB_FONT_SET=240

[env:crowpanel-146]
extends = esp32
build_flags =
  ${esp32.build_flags}
  -D KNOB_BOARD=\"boards/crowpanel_1_46.h\"
  -D KNOB_FONT_SET=360
